# Vercel Hobby accetta solo cron giornalieri. I calendari esterni (Google)
# vanno aggiornati più spesso così le cancellazioni non restano fantasma.
name: External calendar sync

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: none

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sincronizza calendari esterni
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Manca il secret GitHub CRON_SECRET (lo stesso valore di Vercel)." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://school.musicproeventi.it/api/cron/external-calendar-sync"
          echo
