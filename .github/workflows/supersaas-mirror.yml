# SuperSaaS cutover (2026-10): import/specchio disabilitati.
# Lo schedule è spento. workflow_dispatch resta per eventuale ripristino di emergenza
# (richiede supersaas_import_enabled=1 in app_settings).
name: SuperSaaS mirror

on:
  workflow_dispatch:

permissions:
  contents: none

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggiorna lo specchio SuperSaaS (solo se riabilitato)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Manca il secret GitHub CRON_SECRET (lo stesso valore di Vercel)." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://school.musicproeventi.it/api/cron/supersaas-mirror"
          echo
